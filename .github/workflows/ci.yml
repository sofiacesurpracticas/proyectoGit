name: CI - Desarrollo

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Añadir feature al README
        if: github.event_name == 'pull_request'
        run: |
          BRANCH="${{ github.head_ref }}"
          echo "Añadida feature: $BRANCH" >> README.md

      - name: Guardar cambios del README
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar README desde CI"
            git push origin HEAD:develop
          fi

  validate-dev:
    needs: update-readme
    runs-on: self-hosted
    steps:
      - name: Validar token de desarrollo
        shell: powershell
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:DEV_TOKEN)) {
            Write-Host "ERROR: DEV_TOKEN no está configurado"
            exit 1
          }

          if ($env:DEV_TOKEN -ceq $env:LOCAL_DEV_TOKEN) {
            Write-Host "CORRECTO: los tokens de desarrollo coinciden"
          } else {
            Write-Host "ERROR: los tokens de desarrollo no coinciden"
            exit 1
          }
